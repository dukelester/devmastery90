<div class="dm-skill-row">
    {% for s in weakest_skills %}
    <div class="dm-skill-chip">
        <span class="dm-skill-name">{{ s.skill.name }}</span>
        <span class="dm-mono">{{ s.trend }} {{ s.score }}</span>
        <div class="dm-score-track {% if s.score < 7 %}is-weak{% endif %}">
            <i style="width: {{ s.score|floatformat:0 }}0%"></i>
        </div>
    </div>
    {% empty %}
    <p class="dm-muted">Skills appear after curriculum seed.</p>
    {% endfor %}
</div>
