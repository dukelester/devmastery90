{% for rec in recommendations %}
<div class="dm-list-row" style="align-items:flex-start">
    <div>
        <div style="font-weight:600;color:{% if rec.priority == 'critical' %}var(--danger){% elif rec.priority == 'high' %}var(--alert){% else %}var(--ink){% endif %}">
            {{ rec.title }}
        </div>
        <p class="dm-muted" style="font-size:0.8rem;margin:0.3rem 0 0">{{ rec.reason }}</p>
    </div>
    <span class="dm-mono dm-muted">{{ rec.minutes }}m</span>
</div>
{% empty %}
<p class="dm-muted">Follow today's curriculum. You're on track.</p>
{% endfor %}
{% if today_tasks %}
<a href="{% url 'today' %}" class="dm-btn dm-btn-ghost" style="margin-top:1rem;width:100%">Start recommended work</a>
{% endif %}
