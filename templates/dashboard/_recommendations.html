<div class="bg-gray-900 rounded-lg border border-gray-800 p-4 space-y-3">
    {% for rec in recommendations %}
    <div class="border-b border-gray-800 pb-3 last:border-0">
        <div class="flex justify-between items-start">
            <span class="{% if rec.priority == 'critical' %}text-red-400{% elif rec.priority == 'high' %}text-orange-400{% else %}text-gray-300{% endif %}">
                {{ rec.title }}
            </span>
            <span class="text-gray-400 text-sm">{{ rec.minutes }}m</span>
        </div>
        <p class="text-gray-500 text-sm mt-1">{{ rec.reason }}</p>
    </div>
    {% empty %}
    <p class="text-gray-400">Complete today's curriculum tasks.</p>
    {% endfor %}
</div>
