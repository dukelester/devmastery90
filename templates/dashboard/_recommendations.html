{% for rec in recommendations %}
<div class="dm-list-row dm-rec-row">
    <div class="dm-rec-main">
        <span class="dm-priority-dot is-{{ rec.priority }}" aria-hidden="true"></span>
        <div>
            <div class="dm-rec-title">{{ rec.title }}</div>
            <p class="dm-muted dm-rec-reason">{{ rec.reason }}</p>
        </div>
    </div>
    {% if rec.minutes %}
    <span class="dm-mono dm-muted dm-rec-mins">{{ rec.minutes }}m</span>
    {% endif %}
</div>
{% empty %}
<p class="dm-muted">Follow today’s curriculum. You’re on track.</p>
{% endfor %}
{% if today_tasks %}
<a href="{% url 'today' %}" class="dm-btn dm-btn-ghost dm-btn-block">
    <svg class="dm-ico" aria-hidden="true"><use href="#i-target"/></svg>
    Begin work
</a>
{% endif %}
