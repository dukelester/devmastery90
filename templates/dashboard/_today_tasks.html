{% for task in today_tasks %}
<div class="dm-task">
    <div class="dm-check"></div>
    <div>
        <div class="dm-task-title">{{ task.title }}</div>
        <div class="dm-task-meta">
            <span>
                <svg class="dm-ico dm-ico-sm" aria-hidden="true"><use href="#i-clock"/></svg>
                {{ task.estimated_minutes }}m
            </span>
            {% if task.skill %}<span>{{ task.skill.name }}</span>{% endif %}
            <span class="dm-tag">{{ task.task_type }}</span>
        </div>
    </div>
</div>
{% empty %}
<p class="dm-muted">No open tasks for today.</p>
{% endfor %}
{% if today_tasks %}
<a href="{% url 'today' %}" class="dm-btn dm-btn-primary dm-btn-block">
    <svg class="dm-ico" aria-hidden="true"><use href="#i-arrow"/></svg>
    Open execution view
</a>
{% endif %}
