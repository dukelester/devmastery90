<div class="dm-timer">
    {% if active_session %}
    <p class="dm-timer-status">
        <span class="dm-timer-live"></span>
        Session active
    </p>
    {% if active_session.task %}
    <p class="dm-timer-task">{{ active_session.task.title }}</p>
    {% endif %}
    <p class="dm-muted dm-timer-elapsed">Running {{ active_session.started_at|timesince }}</p>
    <button
        hx-post="{% url 'timer_stop' %}"
        hx-target="#timer-widget"
        hx-swap="innerHTML"
        class="dm-btn dm-btn-danger">
        <svg class="dm-ico" aria-hidden="true"><use href="#i-stop"/></svg>
        Stop & save
    </button>
    {% else %}
    <p class="dm-timer-status dm-timer-idle">Idle</p>
    <p class="dm-muted dm-timer-hint">
        Start a focused block. Sessions feed streak, XP, and analytics.
    </p>
    <button
        hx-post="{% url 'timer_start' %}"
        hx-target="#timer-widget"
        hx-swap="innerHTML"
        class="dm-btn dm-btn-primary">
        <svg class="dm-ico" aria-hidden="true"><use href="#i-play"/></svg>
        Start timer
    </button>
    {% endif %}
</div>
