{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a6b66">
    <title>{% block title %}Error — DevMastery 90{% endblock %}</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("dm-theme");
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'icons/icon-192.png' %}">
    <style>
      /* Critical fallback if theme.css fails to load */
      .dm-error-shell { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
      .dm-error-card { width: min(34rem, 100%); }
    </style>
</head>
<body class="dm-shell dm-error-page">
    <div class="dm-bg" aria-hidden="true">
        <div class="dm-bg-gradient"></div>
        <div class="dm-bg-orb dm-bg-orb-1"></div>
        <div class="dm-bg-orb dm-bg-orb-2"></div>
        <div class="dm-bg-grid"></div>
        <div class="dm-bg-vignette"></div>
    </div>
    <main class="dm-error-shell">
        <div class="dm-error-card dm-panel dm-pad-lg dm-rise">
            {% block error_body %}{% endblock %}
        </div>
    </main>
    <script src="{% static 'js/theme.js' %}" defer></script>
</body>
</html>
