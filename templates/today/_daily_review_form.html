<form hx-post="{% url 'daily_review' %}" hx-target="#daily-review-result" hx-swap="innerHTML" class="dm-panel dm-pad" style="display:flex;flex-direction:column;gap:0.85rem">
    {% csrf_token %}
    <div>
        <label>What did you learn?</label>
        <textarea name="lessons" rows="2" class="dm-textarea"></textarea>
    </div>
    <div>
        <label>Challenges</label>
        <textarea name="challenges" rows="2" class="dm-textarea"></textarea>
    </div>
    <div>
        <label>Wins</label>
        <textarea name="wins" rows="2" class="dm-textarea"></textarea>
    </div>
    <div>
        <label>Tomorrow's focus</label>
        <input name="tomorrow_focus" class="dm-input">
    </div>
    <div>
        <label>Confidence (0–10)</label>
        <input name="confidence_score" type="number" min="0" max="10" value="5" class="dm-input">
    </div>
    <button type="submit" class="dm-btn dm-btn-primary">Save review</button>
</form>
<div id="daily-review-result" style="margin-top:0.5rem"></div>
