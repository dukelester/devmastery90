{% extends "base.html" %}
{% block title %}Password updated — DevMastery 90{% endblock %}
{% block content %}
<div class="dm-auth">
    <div class="dm-auth-stage dm-rise">
        <p class="dm-kicker" style="justify-content:center">Success</p>
        <h1 class="dm-hero-brand" style="font-size:clamp(2rem,6vw,2.6rem)">Password updated</h1>
        <p class="dm-muted" style="text-align:center;margin:0.65rem auto 0;max-width:22rem;line-height:1.55">
            Your password has been set. Sign in with your new credentials.
        </p>
        <p class="dm-auth-foot">
            <a href="{% url 'login' %}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
