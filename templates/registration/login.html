{% extends "base.html" %}
{% block title %}Login — DevMastery 90{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16">
    <h1 class="text-2xl font-bold text-center mb-8">DevMastery 90</h1>
    <form method="post" class="bg-gray-900 p-6 rounded-lg border border-gray-800 space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2 rounded font-medium">Login</button>
    </form>
    <p class="text-center mt-4 text-gray-400">
        No account? <a href="{% url 'register' %}" class="text-emerald-400 hover:underline">Register</a>
    </p>
</div>
{% endblock %}
