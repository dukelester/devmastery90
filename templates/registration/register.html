{% extends "base.html" %}
{% block title %}Register — DevMastery 90{% endblock %}
{% block content %}
<div class="dm-auth">
    <div class="dm-auth-stage dm-rise">
        <p class="dm-kicker" style="text-align:center">Begin Day 1</p>
        <h1 class="dm-hero-brand">DevMastery <em>90</em></h1>
        <p class="dm-muted" style="text-align:center;margin:0.5rem 0 0">Create your training profile and start the program.</p>
        <form method="post" class="dm-panel dm-auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="dm-btn dm-btn-primary" style="width:100%;margin-top:0.5rem">Create account</button>
        </form>
        <p class="dm-auth-foot">
            Already training? <a href="{% url 'login' %}">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
