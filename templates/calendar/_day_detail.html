<div>
    <h3 class="text-lg font-bold">Day {{ day.day_number }}: {{ day.title }}</h3>
    <p class="text-emerald-400">{{ day.focus }}</p>
    <p class="text-gray-400 text-sm mt-1">Target: {{ day.target_minutes }} min · {{ day.completion_percentage|floatformat:0 }}% complete</p>
    <div class="mt-4 space-y-2">
        {% for task in day.tasks.all %}
        <div class="flex justify-between text-sm py-1 border-b border-gray-800">
            <span class="{% if task.completed %}text-emerald-400{% endif %}">{{ task.title }}</span>
            <span class="text-gray-500">{{ task.estimated_minutes }}m</span>
        </div>
        {% endfor %}
    </div>
</div>
