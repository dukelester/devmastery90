<div>
    <p class="dm-kicker">Day {{ day.day_number }}</p>
    <h3 class="dm-display" style="font-size:1.5rem;margin:0.35rem 0 0">{{ day.title }}</h3>
    <p style="color:var(--signal);font-weight:600;margin:0.4rem 0 0">{{ day.focus }}</p>
    <p class="dm-muted" style="font-size:0.85rem;margin:0.35rem 0 0">
        Target {{ day.target_minutes }} min · {{ day.completion_percentage|floatformat:0 }}% complete
    </p>
    <div style="margin-top:1rem">
        {% for task in day.tasks.all %}
        <div class="dm-list-row">
            <span {% if task.completed %}style="color:var(--signal)"{% endif %}>{{ task.title }}</span>
            <span class="dm-mono dm-muted">{{ task.estimated_minutes }}m</span>
        </div>
        {% endfor %}
    </div>
</div>
