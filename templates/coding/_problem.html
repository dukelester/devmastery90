<div id="problem-{{ problem.id }}" class="dm-list-row">
    <div>
        <span style="font-weight:600{% if problem.solved %};color:var(--signal){% endif %}">{{ problem.title }}</span>
        <div class="dm-task-meta">
            <span>{{ problem.category|default:"—" }}</span>
            <span class="dm-tag">{{ problem.difficulty }}</span>
        </div>
    </div>
    {% if not problem.solved %}
    <form hx-post="{% url 'coding_solve' problem.id %}" hx-target="#problem-{{ problem.id }}" hx-swap="outerHTML" style="display:flex;gap:0.4rem;align-items:center">
        {% csrf_token %}
        <input name="time_taken" type="number" placeholder="min" class="dm-input" style="width:4rem">
        <input name="confidence" type="number" min="0" max="10" value="5" class="dm-input" style="width:4rem">
        <button type="submit" class="dm-btn dm-btn-primary dm-btn-sm">Solve</button>
    </form>
    {% else %}
    <span class="dm-mono" style="color:var(--signal);font-weight:600">Solved</span>
    {% endif %}
</div>
