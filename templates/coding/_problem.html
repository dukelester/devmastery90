<div id="problem-{{ problem.id }}" class="bg-gray-900 rounded-lg border border-gray-800 p-4 flex justify-between items-center">
    <div>
        <span class="{% if problem.solved %}text-emerald-400{% endif %}">{{ problem.title }}</span>
        <span class="text-xs text-gray-500 ml-2">{{ problem.category }} · {{ problem.difficulty }}</span>
    </div>
    {% if not problem.solved %}
    <form hx-post="{% url 'coding_solve' problem.id %}" hx-target="#problem-{{ problem.id }}" hx-swap="outerHTML" class="flex gap-2">
        {% csrf_token %}
        <input name="time_taken" type="number" placeholder="min" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs w-16">
        <input name="confidence" type="number" min="0" max="10" value="5" class="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs w-16">
        <button type="submit" class="text-emerald-400 text-xs">Solve</button>
    </form>
    {% else %}
    <span class="text-emerald-400 text-sm">✓ Solved</span>
    {% endif %}
</div>
